<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Cursos - Capacitação Acadêmica</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .team-info-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .team-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color, #4CAF50);
        }

        /* Grade dos Cursos Centralizados no Meio do Card Principal */
        .portal-grid-courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .portal-card-item {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
            border-left: 4px solid var(--accent-green, #4CAF50);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .portal-card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        .portal-card-disabled {
            border-left-color: #888888;
            opacity: 0.85;
        }

        .portal-card-item h3 {
            margin: 10px 0 8px 0;
            font-size: 1.15rem;
        }

        .portal-card-item p {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 15px;
            color: var(--text-muted, #ccc);
        }

        .btn-card-access {
            display: inline-block;
            text-align: center;
            background-color: var(--accent-green, #4CAF50);
            color: #ffffff !important;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 5px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-card-access:hover {
            opacity: 0.9;
        }

        .btn-card-disabled {
            background-color: #555555;
            color: #aaaaaa !important;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🎓 <span>Portal de Cursos</span></a>
            <ul class="nav-links">
