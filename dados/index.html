<!-- Script de Carregamento Dinâmico Atualizado -->
<script>
    async function loadLesson() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'datasus';
        
        // Destacar item selecionado na sidebar
        document.querySelectorAll('.sidebar-menu a').forEach(link => link.classList.remove('active'));
        const activeLink = document.getElementById(`link-${page}`);
        if (activeLink) activeLink.classList.add('active');

        const contentDiv = document.getElementById('lesson-content');

        try {
            // Garante o caminho relativo correto dentro da pasta /dados/
            const response = await fetch(`./lessons/${page}.html`);
            
            if (response.ok) {
                contentDiv.innerHTML = await response.text();
            } else {
                contentDiv.innerHTML = `
                    <span class="badge badge-green">EM BREVE</span>
                    <h1>⚠️ Lição não encontrada (Erro ${response.status})</h1>
                    <p>O arquivo <code>lessons/${page}.html</code> ainda não foi criado ou subido para o GitHub.</p>
                    <div class="callout callout-tip">
                        💡 Verifique se o arquivo existe dentro da pasta <strong>dados/lessons/</strong> no seu repositório.
                    </div>
                `;
            }
        } catch (error) {
            contentDiv.innerHTML = '<h1>Erro de conexão ao carregar o conteúdo.</h1>';
        }
    }

    window.addEventListener('DOMContentLoaded', loadLesson);
</script>
